org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
# Keep the dependency/configuration caches, but do not deserialize Gradle build-output caches.
# Kotlin 2.3.10's build-cache metadata is affected by GHSA-r937-wjx7-w2jp.
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
# Keep the debug app available for manual inspection after connected instrumentation tests.
# AGP defaults this stable option to false and otherwise uninstalls test-installed APKs.
android.injected.androidTest.leaveApksInstalledAfterRun=true
